<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img" aria-labelledby="title desc">
  <title id="title">Saatlik bisiklet talebinde test MAE karşılaştırması</title>
  <desc id="desc">Mevsimsel taban çizgisinin MAE değeri 103.54, takvim ve gözlenen hava durumu Ridge modelinin MAE değeri 77.79 bisiklet/saat. Düşük değer daha iyidir.</desc>
  <rect width="860" height="480" fill="#ffffff"/>
  <text x="48" y="62" fill="#17191d" font-family="Arial, sans-serif" font-size="27" font-weight="700">Kronolojik test · MAE</text>
  <text x="48" y="96" fill="#5f6670" font-family="Arial, sans-serif" font-size="17">Saatlik bisiklet sayısı · düşük değer daha iyi</text>
  <text x="48" y="174" fill="#17191d" font-family="Arial, sans-serif" font-size="18">Mevsimsel taban çizgisi</text>
  <rect x="48" y="193" width="620" height="46" rx="3" fill="#e8ebef"/>
  <rect x="48" y="193" width="584" height="46" rx="3" fill="#8c98a8"/>
  <text x="684" y="225" fill="#17191d" font-family="Arial, sans-serif" font-size="22" font-weight="700">103.54</text>
  <text x="48" y="298" fill="#17191d" font-family="Arial, sans-serif" font-size="18">Takvim + gözlenen hava durumu Ridge</text>
  <rect x="48" y="317" width="620" height="46" rx="3" fill="#e8ebef"/>
  <rect x="48" y="317" width="438" height="46" rx="3" fill="#245aa5"/>
  <text x="502" y="349" fill="#17191d" font-family="Arial, sans-serif" font-size="22" font-weight="700">77.79</text>
  <line x1="48" y1="394" x2="668" y2="394" stroke="#d9dce1"/>
  <text x="48" y="426" fill="#5f6670" font-family="Arial, sans-serif" font-size="15">Kronolojik test dilimi · Washington, DC · 2011–2012</text>
  <text x="48" y="451" fill="#5f6670" font-family="Arial, sans-serif" font-size="15">Geçmiş hava gözlemleri, ilerideki tahmin başarısını kanıtlamaz</text>
</svg>
